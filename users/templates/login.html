{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh; background-color: #222;">
    <div class="card p-4 shadow-lg" style="width: 400px; background-color: #fff; border-radius: 10px;">
        <h3 class="text-center mb-4" style="color: #333;">Login to Recipe Assistant</h3>

        <form method="POST" action="{% url 'home' %}">  
            {% csrf_token %}
            
            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label" style="color: #333;">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label" style="color: #333;">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <!-- Login Button -->
            <button type="submit" class="btn w-100" style="background-color: #ff8c00; color: white; font-weight: bold; border-radius: 5px;">Login</button>

            <!-- Signup Message with Demarcation -->
            <div class="mt-3 text-center">
                <span style="color: #333;">Don't have an account?</span>
                <span class="mx-2" style="color: #666;">|</span>
                <a href="{% url 'signup' %}" style="color: #007bff; text-decoration: none; font-weight: bold;">Sign up</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
