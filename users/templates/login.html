{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh; background-color: #222;">
    <div class="card p-4 shadow-lg" style="width: 400px; background-color: #fff; border-radius: 10px;">
        <h3 class="text-center mb-4" style="color: #333;">Login to Recipe Assistant</h3>

        <form id="loginForm">
            {% csrf_token %}

            <div class="mb-3">
                <label for="username" class="form-label" style="color: #333;">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label" style="color: #333;">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>

            <button type="button" class="btn w-100" style="background-color: #ff8c00; color: white; font-weight: bold; border-radius: 5px;" onclick="loginUser()">Login</button>

            <div class="mt-3 text-center">
                <span style="color: #333;">Don't have an account?</span>
                <a href="{% url 'signup' %}" style="color: #007bff; text-decoration: none; font-weight: bold;">Sign up</a>
            </div>
        </form>
    </div>
</div>
<script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith(name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    
    function loginUser() {
        fetch('/api/auth/login/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            })
        })
        .then(response => response.json())
        .then(data => {
            console.log("API response:", data);
    
            if (data.token) {
                alert("Login successful!");
                localStorage.setItem('authToken', data.token);
                window.location.href = "/";
            } else {
                alert("Login failed: " + (data.error || "Unknown error"));
            }
        })
        .catch(error => console.error("Error:", error));
    }
    </script>
    
{% endblock %}
