{% extends 'base.html' %}

{% block content %}
    <h1 class="welcome-text">Welcome to Recipe Bot for African Meals!</h1>

    <div class="d-flex justify-content-center align-items-center mb-4">
        <h3 class="mb-4 me-3">What meal can I help you with?</h3>
        <i class="fas fa-utensils icon-size"></i>
    </div>

    <div class="search-card">
        <div class="input-group mb-4">
            <input type="text" class="form-control form-control-lg" placeholder="Enter meal name..." aria-label="Meal Search">
            <button class="btn btn-primary btn-lg">Search</button>
        </div>
    </div>

    {% if user.is_authenticated %}
        <div class="text-center mt-3">
            <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
        </div>
    {% endif %}
{% endblock %}
