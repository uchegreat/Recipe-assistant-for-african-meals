{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh; background-color: #222;">
    <div class="card p-4 shadow-lg" style="width: 400px; background-color: #fff; border-radius: 10px;">
        <h3 class="text-center mb-4" style="color: #333;">Create an Account</h3>

        <form method="POST" action="{% url 'home' %}">  
            {% csrf_token %}
            
            <!-- Username -->
            <div class="mb-3">
                <label for="username" class="form-label" style="color: #333;">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label" style="color: #333;">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <!-- Create Password -->
            <div class="mb-3">
                <label for="password" class="form-label" style="color: #333;">Create Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
                <label for="confirm_password" class="form-label" style="color: #333;">Confirm Password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
            </div>

            <!-- Sign Up Button -->
            <button type="submit" class="btn w-100" style="background-color: #ff8c00; color: white; font-weight: bold; border-radius: 5px;">Enter</button>

            <!-- Already have an account? -->
            <div class="mt-3 text-center">
                <span style="color: #333;">Already have an account?</span>
                <a href="{% url 'login' %}" style="color: #007bff; text-decoration: none; font-weight: bold;">Login</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
