<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Bot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"> <!-- Font Awesome for icons -->
    <style>
        /* Custom font */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #2C2C2C;
            color: #FFF;
        }

        /* Container for content */
        .container {
            max-width: 800px;
            margin-top: 50px;
        }

        /* Login button styling */
        .login-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            background-color: #007BFF;
            color: white;
        }

        /* Title Styling */
        .welcome-text {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Header Layout */
        .header-container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 30px;
            background-color: #1B1B1B;
            border-radius: 10px;
        }

        /* Styling for the icons */
        .icon-size {
            font-size: 80px;
            color: #FF8C00;
        }

        /* Input and button styling */
        .input-group {
            margin-bottom: 20px;
        }

        .btn-long {
            width: 100%;
            border-radius: 50px;
            padding: 10px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #FF8C00;
            border: none;
            font-size: 18px;
            padding: 10px;
            border-radius: 50px;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #E67E00;
        }

        /* Styling for the search card */
        .search-card {
            background-color: #333;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        /* Animation for buttons and inputs */
        .btn, .form-control {
            transition: transform 0.3s ease;
        }

        .btn:hover, .form-control:focus {
            transform: scale(1.05);
        }

        /* Footer Styling */
        footer {
            padding: 20px 0;
            text-align: center;
            font-size: 14px;
            background-color: #1B1B1B;
            margin-top: 30px;
            border-radius: 10px;
        }

    </style>
</head>
<body>

   <!-- Header with Login/Logout button -->
   <div class="container header-container">
    {% if user.is_authenticated %}
        <a href="{% url 'logout' %}" class="btn btn-danger login-btn">Logout</a>
    {% else %}
        <a href="{% url 'login' %}" class="btn btn-light login-btn">Login</a>
    {% endif %}
</div>

<!-- Main content block -->
<div class="container mt-5">
    {% block content %}
    {% endblock %}
</div>

<!-- Footer -->
<footer>
    <p>&copy; 2025 Recipe Bot. All rights reserved.</p>
</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
